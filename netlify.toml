[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Keep source and setup files from being served publicly
[[redirects]]
  from = "/schema.sql"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/server.ts"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/route.ts"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
